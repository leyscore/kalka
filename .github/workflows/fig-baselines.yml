name: .fig baselines

# Manual only: writes the .fig import regression baselines on CI, for fixtures too large to parse on
# a laptop (material3.fig). Download the artifact and commit it under
# tests/integration/fig-import/baselines.
on:
  workflow_dispatch:
    inputs:
      fixtures:
        description: Fixture file names, comma-separated
        default: material3.fig
      pages:
        description: Also capture every page on the Linux canvas (tests/e2e/fig-import)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  baselines:
    name: Write baselines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Name the fixtures' LFS paths
        id: paths
        env:
          FIXTURES: ${{ inputs.fixtures }}
        run: echo "include=$(echo "$FIXTURES" | sed 's#\([^,]*\)#tests/fixtures/\1#g')" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        with:
          lfs: 'true'
          # Page captures open every fixture the spec lists.
          lfs-include: ${{ inputs.pages && 'tests/fixtures/gold-preview.fig,tests/fixtures/slots.fig,tests/fixtures/circle-text.fig,tests/fixtures/positivus.fig,tests/fixtures/material3.fig' || steps.paths.outputs.include }}

      - name: Build packages
        run: bun run build:packages

      - name: Write the baselines
        env:
          FIXTURES: ${{ inputs.fixtures }}
          UPDATE_FIG_BASELINES: '1'
        run: |
          # One process per file, which exits once written: the reader keeps handles open.
          for file in ${FIXTURES//,/ }; do
            echo "Writing $file"
            timeout 15m bun -e "import { baselineFor, fingerprintFixture } from './tests/helpers/fig/regression.ts'; baselineFor('$file', await fingerprintFixture('$file')); console.log('Wrote $file'); process.exit(0)"
          done

      - name: Capture every page on the canvas
        if: inputs.pages
        env:
          KALKA_TEST_SERVER: app
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test --project=kalka tests/e2e/fig-import --update-snapshots

      - uses: actions/upload-artifact@v7
        with:
          name: fig-baselines-${{ github.sha }}
          path: |
            tests/integration/fig-import/baselines/*.json
            tests/e2e/fig-import/pages.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 1
