name: Server image

# Builds the self-hosted Kalka server in server/ into ghcr.io/leyscore/kalka-server, then runs the
# published image and its end-to-end test. `latest` follows main; a `server-vX.Y.Z` tag publishes
# that version. App release tags (vX.Y.Z) do not build the server.
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
    tags: ['server-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/leyscore/kalka-server

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=server-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  smoke:
    name: Smoke test the image
    needs: image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Run the published image
        run: |
          docker run -d --name kalka -p 8787:8787 -v kalka-data:/data \
            -e KALKA_SETUP_CODE=ci-setup-code ${{ env.IMAGE }}:latest
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz && break; sleep 1; done
      - name: End-to-end test against the container
        run: KALKA_URL=http://127.0.0.1:8787 KALKA_SETUP_CODE=ci-setup-code KALKA_E2E_MAIL=off node test/e2e.mjs
      - name: Data survives a restart
        run: |
          docker restart kalka
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/api/server | grep '"setupRequired":false'
      - if: failure()
        run: docker logs kalka
