name: Heavy tests

# Manual only: the full fixture corpus is large, and this repository's LFS bandwidth is metered.
on:
  workflow_dispatch:

concurrency:
  group: heavy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Heavy and isolated unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun
        with:
          lfs: 'true'

      - name: Build packages
        run: bun run build:packages

      # Tests lay out with Chromium in the desktop app's render host, which needs a display.
      - name: Build the render host
        run: |
          node electron/node_modules/electron/install.js
          bun run --cwd electron build:render-host

      - name: Heavy fixture unit tests
        run: xvfb-run --auto-servernum bun run test:unit:heavy

      # Fresh global object per file: a suite that only passes because an
      # earlier file initialized a codec, loaded a font or left a database
      # open fails here instead of flaking in a PR shard.
      - name: Quick unit tests with per-file isolation
        if: ${{ !cancelled() }}
        run: xvfb-run --auto-servernum bun run test:unit:isolated
