# Render Blueprint: in Render, New › Blueprint on a fork of leyscore/kalka, Blueprint file server/render.yaml.
# Render keeps data only on a disk, which needs a paid instance type.
services:
  - type: web
    name: kalka-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: kalka-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: KALKA_SETUP_CODE
        generateValue: true
      - key: KALKA_SERVER_NAME
        value: Kalka
