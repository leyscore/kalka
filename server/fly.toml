# fly launch --copy-config, then: fly volumes create kalka_data --size 1 && fly deploy
app = "kalka-server"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[mounts]]
  source = "kalka_data"
  destination = "/data"
