<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kalka installer background</title>
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('../../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');
    font-weight: 200 800;
  }
  @font-face {
    font-family: 'Geist';
    src: url('../../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
    font-weight: 100 900;
  }
  :root {
    --blue: #2f5bea;
    --sky: #9db7f5;
    --ink: #121214;
    --paper: #efefec;
    --muted: #6b6b75;
  }
  html, body {
    margin: 0;
    width: 660px;
    height: 420px;
    overflow: hidden;
    background: var(--paper);
    font-family: 'Geist', 'Helvetica Neue', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(420px 260px at 8% 104%, rgba(47, 91, 234, 0.16), transparent 70%),
      radial-gradient(360px 240px at 96% -6%, rgba(157, 183, 245, 0.42), transparent 70%);
  }
  .grain {
    position: absolute;
    inset: 0;
    opacity: 0.07;
    mix-blend-mode: multiply;
  }
  header {
    position: absolute;
    top: 34px;
    left: 0;
    right: 0;
    text-align: center;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 650;
    font-size: 30px;
    letter-spacing: -0.03em;
  }
  .tile {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: var(--blue);
    display: grid;
    place-items: center;
  }
  .tile svg { width: 24px; height: 24px; display: block; }
  .lead {
    margin: 10px 0 0;
    font-size: 14px;
    color: var(--muted);
  }
  .lead strong { color: var(--ink); font-weight: 560; }
  /* Finder draws the two icons centered at (180, 222) and (480, 222), 112 px wide. */
  .arrow {
    position: absolute;
    left: 252px;
    top: 186px;
    width: 156px;
    height: 72px;
  }
  .wells span {
    position: absolute;
    top: 150px;
    width: 150px;
    height: 172px;
    margin-left: -75px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.5);
    box-shadow: inset 0 0 0 1px rgba(18, 18, 20, 0.05);
  }
  footer {
    position: absolute;
    left: 32px;
    right: 32px;
    bottom: 22px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--muted);
  }
  footer strong { color: var(--ink); font-weight: 560; }
  .site { color: var(--blue); font-weight: 560; }
</style>
</head>
<body>
  <div class="glow"></div>
  <svg class="grain" width="660" height="420" aria-hidden="true">
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#noise)"/>
  </svg>

  <header>
    <div class="brand">
      <span class="tile">
        <svg viewBox="14 14 72 72" aria-hidden="true"><rect x="14" y="14" width="22" height="72" fill="#efefec"/><path d="M40 50 L86 14 L86 50 Z" fill="#efefec"/><path d="M40 50 A46 36 0 0 0 86 86 L86 50 Z" fill="#efefec"/></svg>
      </span>
      Kalka
    </div>
    <p class="lead">Drag <strong>Kalka</strong> into <strong>Applications</strong> to install it.</p>
  </header>

  <div class="wells" aria-hidden="true">
    <span style="left: 180px"></span>
    <span style="left: 480px"></span>
  </div>

  <svg class="arrow" viewBox="0 0 156 72" aria-hidden="true">
    <defs>
      <linearGradient id="stroke" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#9db7f5"/>
        <stop offset="1" stop-color="#2f5bea"/>
      </linearGradient>
    </defs>
    <path d="M8 44 C 48 12, 104 12, 140 38" fill="none" stroke="url(#stroke)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 9"/>
    <path d="M128 26 L142 39 L124 44" fill="none" stroke="#2f5bea" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <footer>
    <div>
      <strong>Beta builds are not signed yet.</strong><br>
      The first time, right-click Kalka in Applications and choose Open.
    </div>
    <div class="site">kalka.design</div>
  </footer>
</body>
</html>
