<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/brand/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" />
    <title>Kalka</title>
    <script src="/boot-theme.js"></script>
    <style>
      :root {
        --loader-bg: #0f0f12;
        --loader-fg: 255, 255, 255;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --loader-bg: #e2e3df;
          --loader-fg: 32, 33, 36;
        }
      }
      html[data-theme='dark'] {
        --loader-bg: #0f0f12;
        --loader-fg: 255, 255, 255;
      }
      html[data-theme='light'] {
        --loader-bg: #e2e3df;
        --loader-fg: 32, 33, 36;
      }
      body { margin: 0; background: var(--loader-bg); }
      /*
       * Boot splash: Kalka's K in frosted glass filling with blue liquid over the brand
       * backdrop, until the app has mounted and fades it out (src/app/shell/support/splash.ts).
       */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: linear-gradient(180deg, #071b6b 0%, #1236b8 30%, #2f5bea 58%, #7fa2f5 82%, #cfdcfc 100%);
        transition: opacity 160ms ease, transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #boot-splash[data-leaving] { opacity: 0; transform: scale(1.02); pointer-events: none; }
      /* The day: kalka.design's pixel sky, a fine grain and dot clouds that sway. */
      #boot-splash .grain {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0 1px, transparent 1.4px);
        background-size: 6px 6px;
      }
      #boot-splash .clouds {
        position: absolute;
        inset: 0 -160px;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0 2.6px, transparent 3.1px);
        background-size: 9px 9px;
        -webkit-mask-image: radial-gradient(ellipse 20% 12% at 14% 84%, #000 15%, transparent 70%), radial-gradient(ellipse 26% 12% at 54% 96%, #000 15%, transparent 70%), radial-gradient(ellipse 18% 10% at 88% 80%, #000 15%, transparent 70%), radial-gradient(ellipse 9% 5% at 82% 22%, #000 15%, transparent 70%), radial-gradient(ellipse 8% 4% at 16% 20%, #000 15%, transparent 70%);
        mask-image: radial-gradient(ellipse 20% 12% at 14% 84%, #000 15%, transparent 70%), radial-gradient(ellipse 26% 12% at 54% 96%, #000 15%, transparent 70%), radial-gradient(ellipse 18% 10% at 88% 80%, #000 15%, transparent 70%), radial-gradient(ellipse 9% 5% at 82% 22%, #000 15%, transparent 70%), radial-gradient(ellipse 8% 4% at 16% 20%, #000 15%, transparent 70%);
        animation: splash-drift 26s ease-in-out infinite alternate;
      }
      /* The night of kalka.design's footer: night blue, a fine star grid and four-point stars. */
      #boot-splash .night { display: none; position: absolute; inset: 0; background: linear-gradient(180deg, #0d1440 0%, #0a1033 45%, #060920 100%); }
      #boot-splash .night .stars {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(157, 183, 245, 0.1) 0 0.8px, transparent 1.2px);
        background-size: 16px 16px;
      }
      #boot-splash .night svg { position: absolute; fill: #dce6ff; opacity: 0.45; filter: drop-shadow(0 0 4px rgba(220, 230, 255, 0.7)); animation: splash-star var(--d) ease-in-out var(--l) infinite; }
      html[data-theme='dark'] #boot-splash .night { display: block; }
      html[data-theme='dark'] #boot-splash .grain,
      html[data-theme='dark'] #boot-splash .clouds { display: none; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #boot-splash .night { display: block; }
        html:not([data-theme]) #boot-splash .grain,
        html:not([data-theme]) #boot-splash .clouds { display: none; }
      }
      #boot-splash .tile {
        position: relative;
        width: 112px;
        height: 112px;
        border-radius: 25px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.32), rgba(255, 255, 255, 0.08));
        border: 1px solid rgba(255, 255, 255, 0.45);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.6),
          0 24px 60px -18px rgba(18, 18, 20, 0.45),
          0 2px 8px rgba(18, 18, 20, 0.12);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        animation: splash-in 700ms cubic-bezier(0.2, 1.2, 0.4, 1) both;
      }
      #boot-splash .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      #boot-splash .liquid { animation: splash-fill 1.8s cubic-bezier(0.45, 0, 0.2, 1) infinite; }
      #boot-splash .wave { animation: splash-wave 1.1s linear infinite; }
      @keyframes splash-in {
        from { opacity: 0; transform: scale(0.86) translateY(8px); filter: blur(8px); }
        to { opacity: 1; transform: none; filter: none; }
      }
      @keyframes splash-fill {
        0% { transform: translateY(76px); }
        72%, 100% { transform: translateY(0); }
      }
      @keyframes splash-wave { to { transform: translateX(-40px); } }
      @keyframes splash-drift {
        from { transform: translateX(-130px); }
        to { transform: translateX(130px); }
      }
      @keyframes splash-star {
        0%, 100% { opacity: 0.35; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .clouds, #boot-splash .night svg, #boot-splash .wave, #boot-splash .tile { animation: none; }
        #boot-splash .liquid { animation: none; transform: none; }
      }
      /* Pre-boot support notice; the app CSS never loads when it shows. */
      #boot-notice {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 48px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        max-width: 560px;
        margin: 0 auto;
        text-align: center;
        color: rgb(var(--loader-fg));
        background: var(--loader-bg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #boot-notice img { width: 40px; height: 40px; margin-bottom: 8px; }
      #boot-notice h1 { margin: 0; font-size: 18px; font-weight: 600; }
      #boot-notice p { margin: 0; color: rgba(var(--loader-fg), 0.75); }
      #boot-notice nav { margin-top: 8px; color: rgba(var(--loader-fg), 0.45); }
      #boot-notice a { color: rgb(var(--loader-fg)); text-underline-offset: 3px; }
      #boot-notice details { margin-top: 16px; max-width: 100%; color: rgba(var(--loader-fg), 0.6); }
      #boot-notice summary { cursor: pointer; }
      #boot-notice pre {
        margin: 8px 0 0;
        padding: 12px;
        max-height: 40vh;
        overflow: auto;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        border-radius: 6px;
        background: rgba(var(--loader-fg), 0.06);
        user-select: text;
        -webkit-user-select: text;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <div id="boot-splash" aria-label="Kalka" role="img">
      <div class="grain"></div>
      <div class="clouds"></div>
      <div class="night">
        <div class="stars"></div>
        <svg viewBox="0 0 24 24" style="left:6%;top:38%;width:10px;height:10px;--d:3.8s;--l:0s"><path d="M12 0C12.6 6.6 17.4 11.4 24 12C17.4 12.6 12.6 17.4 12 24C11.4 17.4 6.6 12.6 0 12C6.6 11.4 11.4 6.6 12 0Z" /></svg>

        <svg viewBox="0 0 24 24" style="left:29%;top:44%;width:12px;height:12px;--d:4.4s;--l:-2.6s"><path d="M12 0C12.6 6.6 17.4 11.4 24 12C17.4 12.6 12.6 17.4 12 24C11.4 17.4 6.6 12.6 0 12C6.6 11.4 11.4 6.6 12 0Z" /></svg>
        <svg viewBox="0 0 24 24" style="left:41%;top:78%;width:8px;height:8px;--d:6.0s;--l:-0.8s"><path d="M12 0C12.6 6.6 17.4 11.4 24 12C17.4 12.6 12.6 17.4 12 24C11.4 17.4 6.6 12.6 0 12C6.6 11.4 11.4 6.6 12 0Z" /></svg>
        <svg viewBox="0 0 24 24" style="left:52%;top:36%;width:9px;height:9px;--d:4.9s;--l:-3.1s"><path d="M12 0C12.6 6.6 17.4 11.4 24 12C17.4 12.6 12.6 17.4 12 24C11.4 17.4 6.6 12.6 0 12C6.6 11.4 11.4 6.6 12 0Z" /></svg>
        <svg viewBox="0 0 24 24" style="left:63%;top:58%;width:14px;height:14px;--d:5.6s;--l:-1.9s"><path d="M12 0C12.6 6.6 17.4 11.4 24 12C17.4 12.6 12.6 17.4 12 24C11.4 17.4 6.6 12.6 0 12C6.6 11.4 11.4 6.6 12 0Z" /></svg>
        <svg viewBox="0 0 24 24" style="left:74%;top:42%;width:8px;height:8px;--d:3.6s;--l:-0.4s"><path d="M12 0C12.6 6.6 17.4 11.4 24 12C17.4 12.6 12.6 17.4 12 24C11.4 17.4 6.6 12.6 0 12C6.6 11.4 11.4 6.6 12 0Z" /></svg>
        <svg viewBox="0 0 24 24" style="left:86%;top:70%;width:11px;height:11px;--d:4.7s;--l:-2.2s"><path d="M12 0C12.6 6.6 17.4 11.4 24 12C17.4 12.6 12.6 17.4 12 24C11.4 17.4 6.6 12.6 0 12C6.6 11.4 11.4 6.6 12 0Z" /></svg>
        <svg viewBox="0 0 24 24" style="left:94%;top:48%;width:7px;height:7px;--d:5.9s;--l:-3.6s"><path d="M12 0C12.6 6.6 17.4 11.4 24 12C17.4 12.6 12.6 17.4 12 24C11.4 17.4 6.6 12.6 0 12C6.6 11.4 11.4 6.6 12 0Z" /></svg>
        <svg viewBox="0 0 24 24" style="left:12%;top:86%;width:9px;height:9px;--d:4.2s;--l:-1.1s"><path d="M12 0C12.6 6.6 17.4 11.4 24 12C17.4 12.6 12.6 17.4 12 24C11.4 17.4 6.6 12.6 0 12C6.6 11.4 11.4 6.6 12 0Z" /></svg>
        <svg viewBox="0 0 24 24" style="left:58%;top:90%;width:7px;height:7px;--d:5.0s;--l:-2.9s"><path d="M12 0C12.6 6.6 17.4 11.4 24 12C17.4 12.6 12.6 17.4 12 24C11.4 17.4 6.6 12.6 0 12C6.6 11.4 11.4 6.6 12 0Z" /></svg>
        <svg viewBox="0 0 24 24" style="left:81%;top:30%;width:9px;height:9px;--d:6.3s;--l:-0.6s"><path d="M12 0C12.6 6.6 17.4 11.4 24 12C17.4 12.6 12.6 17.4 12 24C11.4 17.4 6.6 12.6 0 12C6.6 11.4 11.4 6.6 12 0Z" /></svg>
      </div>
      <div class="tile">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <clipPath id="splash-k">
              <rect x="22" y="22" width="17.11" height="56" />
              <path d="M42.22 50 L78 22 L78 50 Z" />

            <linearGradient id="splash-blue" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="#2448c4" />
              <stop offset="1" stop-color="#4b74f0" />

          <g fill="rgba(255,255,255,0.22)">
            <rect x="22" y="22" width="17.11" height="56" />

            <path d="M42.22 50 A35.78 28 0 0 0 78 78 L78 50 Z" />

          <g clip-path="url(#splash-k)">
            <g class="liquid">

                d="M0 21 Q10 17 20 21 T40 21 T60 21 T80 21 T100 21 T120 21 T140 21 V100 H0 Z"
              />
            </g>
          </g>
          <g fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="0.8">
            <rect x="22" y="22" width="17.11" height="56" />
            <path d="M42.22 50 L78 22 L78 50 Z" />
            <path d="M42.22 50 A35.78 28 0 0 0 78 78 L78 50 Z" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
